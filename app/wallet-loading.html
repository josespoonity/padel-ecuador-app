<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preparando tu pase…</title>
<style>
  :root { --blue: #1581C5; --bg: #EDF5FB; --ink: #23303B; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { text-align: center; }
  .spinner {
    width: 42px; height: 42px;
    margin: 0 auto 20px;
    border: 3px solid rgba(21,129,197,.15);
    border-top-color: var(--blue);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  p { margin: 0; font-size: 17px; letter-spacing: .2px; }
  .sub { margin-top: 8px; font-size: 14px; color: rgba(35,48,59,.55); }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="spinner"></div>
    <p>Preparando tu pase…</p>
    <p class="sub">Solo toma un momento.</p>
  </div>
</body>
</html>
